version: 2
updates:

  # Dependencias Maven del backend
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"
    # Un solo PR semanal con todas las subidas minor y patch. Las major quedan
    # fuera del grupo a propósito: abren PR individual porque necesitan revisión.
    groups:
      maven-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Spring Boot se actualiza manualmente para controlar el timing
      - dependency-name: "org.springframework.boot:*"
        update-types: ["version-update:semver-major"]

  # Dependencias npm del frontend (pnpm — Dependabot lo gestiona via ecosystem npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    # Dependencias de runtime y de desarrollo en PRs separados: las de build y
    # linting se pueden mergear con mucho menos escrutinio que las que acaban
    # en el bundle que sirve el navegador.
    groups:
      frontend-prod-minor-patch:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      frontend-dev-minor-patch:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Dependencias npm del MCP server
  - package-ecosystem: "npm"
    directory: "/mcp"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "mcp"
    groups:
      mcp-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Actions de GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    # Aquí se agrupan también las major: las Actions casi solo publican
    # versiones major (v4 → v5) y se revisan como un conjunto, con el propio
    # pipeline como red de seguridad. Dejarlas sueltas genera un PR por acción
    # y cada merge obliga a rebasar los demás.
    groups:
      github-actions:
        patterns:
          - "*"

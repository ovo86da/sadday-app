name: Security Audit

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/pom.xml"
      - "frontend/pnpm-lock.yaml"
      - "mcp/package-lock.json"
      - ".github/workflows/security.yml"
  schedule:
    # Lunes a las 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Snyk — vulnerabilidades en dependencias Maven
  # Requiere secret: SNYK_TOKEN (obtener en snyk.io → Account Settings → API Token)
  # ─────────────────────────────────────────────────────────────────────────────
  snyk:
    name: Snyk Dependency Scan
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      # El CLI se instala en el runner en vez de usar snyk/actions/maven, que
      # es una acción de CONTENEDOR. Aquella recibía el JAVA_HOME del host vía
      # `docker run -e JAVA_HOME`, pero esa ruta
      # (/opt/hostedtoolcache/Java_Temurin...) no existe dentro del contenedor
      # de Snyk, y Maven aborta:
      #
      #   The JAVA_HOME environment variable is not defined correctly
      #
      # Corriendo el CLI directamente, Maven usa el JAVA_HOME que dejó
      # setup-java, que sí es válido, y `working-directory` funciona de verdad
      # (en una acción no aplica, solo en pasos `run`).
      - name: Instalar el CLI de Snyk
        uses: snyk/actions/setup@master

      - name: Run Snyk to check for vulnerabilities
        run: |
          set +e
          snyk test \
            --severity-threshold=high \
            --sarif-file-output=snyk-backend.sarif \
            --project-name=sadday-app
          code=$?
          set -e
          # 0 = limpio · 1 = encontró vulnerabilidades (no tumba el job) · >=2 = el CLI falló
          if [ "$code" -ge 2 ]; then
            echo "::error::Snyk terminó con código $code sin escanear. Es un fallo del CLI, no un hallazgo."
            exit "$code"
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Distingue "escaneó y encontró cosas" de "no llegó a escanear".
      # Sin esto, continue-on-error ocultaba que Snyk llevaba meses sin
      # analizar nada.
      - name: Verificar que Snyk produjo resultados
        run: |
          if [ ! -s snyk-backend.sarif ]; then
            echo "::error::Snyk no generó SARIF — no llegó a escanear. Revisar el paso anterior."
            exit 1
          fi
          echo "SARIF generado: $(wc -c < snyk-backend.sarif) bytes"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: backend/snyk-backend.sarif
          category: snyk-backend

  # ─────────────────────────────────────────────────────────────────────────────
  # Snyk — vulnerabilidades en dependencias frontend (pnpm)
  # Requiere secret: SNYK_TOKEN
  # ─────────────────────────────────────────────────────────────────────────────
  snyk-frontend:
    name: Snyk — Frontend Dependencies
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          package_json_file: frontend/package.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Mismo mecanismo que el job de backend: el CLI en el runner, no la
      # acción de contenedor. Con el contenedor el SARIF caía en la raíz del
      # workspace mientras el resto del job trabajaba en frontend/, y el paso
      # de verificación lo buscaba donde no estaba.
      - name: Instalar el CLI de Snyk
        uses: snyk/actions/setup@master

      # `--all-projects` es obligatorio: frontend/ tiene pnpm-lock.yaml y
      # pnpm-workspace.yaml a la vez, y Snyk se niega a elegir objetivo
      # (SNYK-CLI-0000). Comprobado que `--file=pnpm-lock.yaml` no sirve: esa
      # validación ocurre antes de resolver el objetivo y falla igual.
      #
      # Consecuencia: --all-projects ignora --project-name, así que Snyk
      # bautiza el análisis con su directorio temporal y en Code Scanning
      # aparece como `Snyk/Open Source/frontend-tmp/0` — no como la `category`
      # de abajo, que el SARIF sobreescribe con su propio automationDetails.
      # El nombre es determinista (verificado en ejecuciones distintas), así
      # que las alertas se cierran solas al desaparecer; pero no lo elegimos
      # nosotros. Si algún día cambia, las alertas viejas quedarán colgadas.
      - name: Run Snyk
        run: |
          set +e
          snyk test \
            --severity-threshold=high \
            --sarif-file-output=snyk-frontend.sarif \
            --all-projects
          code=$?
          set -e
          # 0 = limpio · 1 = encontró vulnerabilidades (no tumba el job) · >=2 = el CLI falló
          if [ "$code" -ge 2 ]; then
            echo "::error::Snyk terminó con código $code sin escanear. Es un fallo del CLI, no un hallazgo."
            exit "$code"
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Verificar que Snyk produjo resultados
        run: |
          if [ ! -s snyk-frontend.sarif ]; then
            echo "::error::Snyk no generó SARIF — no llegó a escanear. Revisar el paso anterior."
            exit 1
          fi
          echo "SARIF generado: $(wc -c < snyk-frontend.sarif) bytes"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: frontend/snyk-frontend.sarif
          category: snyk-frontend

  # ─────────────────────────────────────────────────────────────────────────────
  # Snyk — vulnerabilidades en dependencias MCP (npm)
  # Requiere secret: SNYK_TOKEN
  # ─────────────────────────────────────────────────────────────────────────────
  snyk-mcp:
    name: Snyk — MCP Dependencies
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Mismo mecanismo que el job de backend: el CLI en el runner, no la
      # acción de contenedor. Con el contenedor el SARIF caía en la raíz del
      # workspace mientras el resto del job trabajaba en mcp/, y el paso
      # de verificación lo buscaba donde no estaba.
      - name: Instalar el CLI de Snyk
        uses: snyk/actions/setup@master

      - name: Run Snyk
        run: |
          set +e
          snyk test \
            --severity-threshold=high \
            --sarif-file-output=snyk-mcp.sarif \
            --project-name=sadday-mcp
          code=$?
          set -e
          # 0 = limpio · 1 = encontró vulnerabilidades (no tumba el job) · >=2 = el CLI falló
          if [ "$code" -ge 2 ]; then
            echo "::error::Snyk terminó con código $code sin escanear. Es un fallo del CLI, no un hallazgo."
            exit "$code"
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Verificar que Snyk produjo resultados
        run: |
          if [ ! -s snyk-mcp.sarif ]; then
            echo "::error::Snyk no generó SARIF — no llegó a escanear. Revisar el paso anterior."
            exit 1
          fi
          echo "SARIF generado: $(wc -c < snyk-mcp.sarif) bytes"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: mcp/snyk-mcp.sarif
          category: snyk-mcp

  # ─────────────────────────────────────────────────────────────────────────────
  # OWASP Dependency Check — escaneo contra base de datos NVD
  # No requiere cuentas externas. Primera ejecución tarda ~10 min (descarga NVD).
  # ─────────────────────────────────────────────────────────────────────────────
  owasp-dep-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Cache NVD database
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-cache-${{ github.run_id }}
          restore-keys: nvd-cache-

      - name: Run OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:12.1.1:check \
            --no-transfer-progress -B \
            -DfailBuildOnCVSS=9 \
            -DsuppressionFile=.owasp-suppressions.xml \
            -Dformat=ALL \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }}
        continue-on-error: true   # No bloquear en hallazgos — revisar reporte

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owasp-dep-check-report
          path: backend/target/dependency-check-report.html
          retention-days: 30

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: backend/target/dependency-check-report.sarif

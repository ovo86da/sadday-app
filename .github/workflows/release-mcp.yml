name: MCP — Release Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión a publicar (ej: 1.0.0)"
        required: true

jobs:
  release:
    name: Build & Publish MCP Binaries
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # necesario para crear el GitHub Release y subir assets

    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type check (tsc)
        run: npm run build

      - name: Bundle ESM → CJS (esbuild)
        run: npm run bundle

      - name: Package binaries (@yao-pkg/pkg)
        run: npx @yao-pkg/pkg dist/bundle.cjs --targets node20-macos-arm64,node20-macos-x64,node20-win-x64,node20-linux-x64 --out-path bin --output sadday-mcp

      - name: Rename binaries with version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          mv bin/sadday-mcp-macos-arm64  bin/sadday-mcp-v${VERSION}-macos-arm64
          mv bin/sadday-mcp-macos-x64    bin/sadday-mcp-v${VERSION}-macos-x64
          mv bin/sadday-mcp-win-x64.exe  bin/sadday-mcp-v${VERSION}-win-x64.exe
          mv bin/sadday-mcp-linux-x64    bin/sadday-mcp-v${VERSION}-linux-x64
          ls -lh bin/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mcp-v${{ github.event.inputs.version }}
          name: "Sadday MCP v${{ github.event.inputs.version }}"
          body: |
            ## Sadday MCP Server v${{ github.event.inputs.version }}

            Servidor MCP para consultar datos del Club de Montaña Sadday desde Claude Desktop, Cursor y otros clientes IA.

            ### Descarga

            | Plataforma | Archivo |
            |---|---|
            | macOS Apple Silicon (M1/M2/M3) | `sadday-mcp-v${{ github.event.inputs.version }}-macos-arm64` |
            | macOS Intel | `sadday-mcp-v${{ github.event.inputs.version }}-macos-x64` |
            | Windows 64-bit | `sadday-mcp-v${{ github.event.inputs.version }}-win-x64.exe` |
            | Linux 64-bit | `sadday-mcp-v${{ github.event.inputs.version }}-linux-x64` |

            ### Instrucciones

            Ver [Flujo 14 — Asistente IA MCP](https://github.com/${{ github.repository }}/blob/main/docs/flujos/14-asistente-ia-mcp.md) para instrucciones completas de configuración.

            > **macOS:** Si GateKeeper bloquea el binario, haz clic derecho → Abrir, o ejecuta `xattr -c sadday-mcp-v${{ github.event.inputs.version }}-macos-arm64` en la terminal.
          files: |
            mcp/bin/sadday-mcp-v${{ github.event.inputs.version }}-macos-arm64
            mcp/bin/sadday-mcp-v${{ github.event.inputs.version }}-macos-x64
            mcp/bin/sadday-mcp-v${{ github.event.inputs.version }}-win-x64.exe
            mcp/bin/sadday-mcp-v${{ github.event.inputs.version }}-linux-x64
          draft: false
          prerelease: false

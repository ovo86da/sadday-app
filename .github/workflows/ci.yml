name: CI — Build, Test & SAST

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "mcp/**"
      - ".github/workflows/ci.yml"
  pull_request:
    # develop incluido: es la rama a la que va todo el trabajo diario. Con solo
    # main aquí, ningún PR del flujo normal corría los tests — pasaban o
    # fallaban sin que nadie lo viera hasta después del merge.
    branches: [main, develop]
    paths:
      - "backend/**"
      - "frontend/**"
      - "mcp/**"
      - ".github/workflows/ci.yml"
  # Permite relanzarlo a mano para verificar un arreglo sin tener que empujar
  # un commit vacío (p. ej. tras rotar el token de SonarCloud).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Build y tests de integración con Testcontainers (PostgreSQL)
  # ─────────────────────────────────────────────────────────────────────────────
  test:
    name: Build & Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # Requerido por SonarCloud para análisis de blame

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Build and test with coverage
        run: mvn verify --no-transfer-progress -B
        env:
          # Testcontainers necesita acceso al Docker socket (disponible en ubuntu-24.04)
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: backend/target/surefire-reports/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────
  # Tests del frontend (Vitest)
  # ─────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend — Build & Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          package_json_file: frontend/package.json

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # ─────────────────────────────────────────────────────────────────────────────
  # SonarCloud — calidad de código y cobertura
  # Requiere secrets: SONAR_TOKEN
  # Requiere variables: SONAR_PROJECT_KEY, SONAR_ORGANIZATION
  # ─────────────────────────────────────────────────────────────────────────────
  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-24.04
    needs: test
    # Sin continue-on-error a propósito. `mvn sonar:sonar` no lleva
    # -Dsonar.qualitygate.wait, así que NO falla por el quality gate: solo
    # falla si la subida falla (token caducado, red, proyecto inexistente).
    # Con continue-on-error, el job estuvo en rojo de mayo a octubre de 2026
    # por un token caducado sin que nadie se enterara.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "maven"

      - name: Download JaCoCo report
        uses: actions/download-artifact@v8
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/

      - name: Compile (requerido por Sonar para analizar clases Java)
        run: mvn compile --no-transfer-progress -B -DskipTests

      - name: SonarCloud analysis
        run: |
          mvn sonar:sonar --no-transfer-progress -B \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.java.coveragePlugin=jacoco \
            -Dsonar.exclusions="**/dto/**,**/entity/**,**/config/**,**/shared/exception/**,**/pages/teoria/**"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Semgrep SAST — análisis estático de seguridad
  # Los hallazgos se publican en la pestaña Security > Code Scanning de GitHub
  # ─────────────────────────────────────────────────────────────────────────────
  semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/spring
            p/javascript
            p/react
            p/owasp-top-ten
            p/secrets
          generateSarif: "1"
        env:
          # SEMGREP_APP_TOKEN es opcional; sin él, corre en modo solo-CLI sin cloud dashboard
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true   # No bloquear CI por hallazgos — visibilidad vía SARIF

      # continue-on-error no distingue "encontró cosas" de "no llegó a
      # analizar". Sin esta comprobación, un Semgrep roto saldría en verde.
      - name: Verificar que Semgrep produjo resultados
        run: |
          if [ ! -s semgrep.sarif ]; then
            echo "::error::Semgrep no generó SARIF — no llegó a analizar. Revisar el paso anterior."
            exit 1
          fi
          echo "SARIF generado: $(wc -c < semgrep.sarif) bytes"

      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ─────────────────────────────────────────────────────────────────────────────
  # MCP server — Type check y build (TypeScript)
  # ─────────────────────────────────────────────────────────────────────────────
  build-mcp:
    name: MCP — Type Check & Build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build (tsc)
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # E2E con Playwright. Levanta la pila entera: Playwright solo arranca el
  # frontend (`webServer`), el backend hay que ponerlo aqui, y necesita postgres
  # y minio porque los tests suben documentos de verdad al bucket.
  #
  # Corre con el perfil `local` a proposito: sus defaults apuntan todos a
  # localhost, que es justo lo que el runner tiene, y es el unico perfil donde
  # DevDataInitializer crea los usuarios de prueba. No hace falta perfil nuevo.
  # ─────────────────────────────────────────────────────────────────────────────
  test-e2e:
    name: Frontend — E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Las claves JWT no estan versionadas (backend/.gitignore). Los tests de
      # integracion se generan el par en memoria; un backend de verdad necesita
      # los ficheros, asi que se crean aqui y mueren con el runner.
      - name: Generar claves JWT efímeras
        run: |
          mkdir -p backend/src/main/resources/keys
          openssl genpkey -algorithm RSA -out backend/src/main/resources/keys/private.pem \
            -pkeyopt rsa_keygen_bits:2048
          openssl rsa -in backend/src/main/resources/keys/private.pem \
            -pubout -out backend/src/main/resources/keys/public.pem

      - name: Levantar postgres, minio y mailpit
        run: docker compose up -d postgres minio mailpit

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
          # Obligatorio: `packageManager` esta en frontend/package.json, no en
          # el de la raiz, y sin esto la accion falla antes de empezar.
          package_json_file: frontend/package.json

      - name: Esperar a que la infraestructura esté sana
        run: |
          for i in $(seq 1 60); do
            sano=$(docker compose ps --format '{{.Health}}' postgres minio | grep -c healthy || true)
            [ "$sano" -ge 2 ] && { echo "infraestructura lista"; exit 0; }
            sleep 2
          done
          echo "::error::postgres o minio no llegaron a healthy"
          docker compose logs postgres minio
          exit 1

      - name: Arrancar el backend
        working-directory: backend
        run: |
          ./mvnw -q spring-boot:run -Dspring-boot.run.profiles=local > backend.log 2>&1 &
          for i in $(seq 1 180); do
            curl -fsS -o /dev/null http://localhost:8080/actuator/health && \
              { echo "backend arriba tras ${i}s"; exit 0; }
            if grep -qE "APPLICATION FAILED TO START|BUILD FAILURE" backend.log; then
              echo "::error::el backend no arrancó"; tail -60 backend.log; exit 1
            fi
            sleep 1
          done
          echo "::error::el backend no respondió en 180s"
          tail -60 backend.log
          exit 1

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Las credenciales del perfil `local` las crea DevDataInitializer y ya
      # estan en el codigo, que es publico a proposito: no son un secreto y no
      # valen nada fuera de un contenedor que se destruye al terminar el job.
      - name: Preparar .env.e2e
        working-directory: frontend
        run: |
          cat > .env.e2e <<'EOF'
          E2E_ADMIN_USERNAME=admin
          E2E_ADMIN_PASSWORD=Admin123!
          E2E_SOCIO_USERNAME=socio
          E2E_SOCIO_PASSWORD=Socio123!
          EOF

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        run: pnpm exec playwright test --reporter=list

      - name: Subir el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend/backend.log
          retention-days: 7

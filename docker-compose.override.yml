# =============================================================================
# Docker Compose — valores de DESARROLLO LOCAL
#
# Compose carga este fichero automáticamente junto a docker-compose.yml cuando
# ejecutas `docker compose up` sin flags. Por eso clonar el repo y levantar la
# app sigue funcionando sin configurar nada: los valores de abajo son los
# defaults de desarrollo.
#
# Staging y producción pasan sus ficheros con -f explícito
# (`docker compose -f docker-compose.yml -f docker-compose.prod.yml ...`),
# y Compose NO auto-carga este override cuando se usa -f. Es justo lo que
# queremos: ningún valor de desarrollo puede filtrarse a un entorno real.
#
# Por eso los secretos de desarrollo viven aquí y no en docker-compose.yml:
# el fichero base lo cargan los tres entornos, este solo lo carga tu máquina.
#
# Para cambiar algo en local, exporta la variable antes de levantar
# (p. ej. `DB_PASSWORD=otra docker compose up`) o usa un fichero .env.
# =============================================================================

services:

  postgres:
    environment:
      POSTGRES_DB:       ${DB_NAME:-sadday_app}
      POSTGRES_USER:     ${DB_USER:-sadday_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sadday_password_local123}

  minio:
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # La imagen crea estos buckets al arrancar (sustituye al antiguo minio-init)
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-sadday-local}

  api:
    depends_on:
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_NAME:     ${DB_NAME:-sadday_app}
      DB_USER:     ${DB_USER:-sadday_admin}
      DB_PASSWORD: ${DB_PASSWORD:-sadday_password_local123}
      # Claves JWT: en local se leen del classpath (backend/src/main/resources/keys/)
      # Generar con: scripts/generate-keys.sh
      JWT_PRIVATE_KEY_LOCATION: classpath:keys/private.pem
      JWT_PUBLIC_KEY_LOCATION:  classpath:keys/public.pem
      JWT_ISSUER:  sadday-app-local
      # Clave de desarrollo, deliberadamente pública. Solo se usa en local:
      # staging y producción la reciben de Infisical y nunca cargan este fichero.
      # Generar una propia con: openssl rand -base64 32
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:-6zwG8t6FdMeIGdSLpsAZ+GCANUUV6lm46I5gTxE5vxQ=}
      # Correo: mailpit captura todo en http://localhost:8025 (no envía nada fuera)
      MAIL_FROM:     ${MAIL_FROM:-noreply@sadday.local}
      MAIL_HOST:     ${MAIL_HOST:-mailpit}
      MAIL_PORT:     ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-dev}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-dev}
      APP_URL:       ${APP_URL:-http://localhost:3000}
      # El frontend en Docker se sirve en :3000, pero application-local.yml fija
      # cors-origins a los puertos del dev server de Vite (5173/5174) e ignora
      # APP_URL. Sin esto el login desde http://localhost:3000 responde
      # 403 "Invalid CORS request". Se listan los tres para que funcionen tanto
      # el stack completo en Docker como el flujo híbrido con hot-reload.
      CORS_ORIGINS:  ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174}
      # Almacenamiento: MinIO local en lugar de AWS S3
      S3_BUCKET:     ${S3_BUCKET:-sadday-local}
      S3_REGION:     ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_ENDPOINT:   http://minio:9000

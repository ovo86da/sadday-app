# =============================================================================
# Docker Compose — definición BASE, común a los tres entornos.
# La cargan local, staging y producción, así que aquí NO va ningún valor
# específico de un entorno: ni secretos, ni endpoints, ni credenciales.
#
# Los valores de desarrollo están en docker-compose.override.yml, que Compose
# auto-carga solo cuando ejecutas `docker compose up` sin -f. Los entornos
# reales pasan su fichero con -f explícito y nunca ven ese override.
#
# Uso:
#   local    → docker compose up                  (base + override)
#   staging  → docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
#   prod     → docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# PostgreSQL se expone en localhost:5432 para conectarse con DBeaver/pgAdmin
# (staging lo mantiene, producción lo cierra con `ports: []`).
# Flyway aplica las migraciones automáticamente al iniciar la API.
# =============================================================================

services:

  postgres:
    image: postgres:16-alpine
    container_name: sadday-db
    # Credenciales: override.yml en local, Infisical en staging/producción.
    environment:
      TZ: America/Guayaquil
    ports:
      - "5432:5432"   # Expuesto solo en local para DBeaver/pgAdmin
    volumes:
      - sadday-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sadday_admin} -d ${DB_NAME:-sadday_app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sadday-network

  # MinIO retiró minio/minio y minio/mc de Docker Hub (404) y su registro en
  # quay.io exige autenticación, así que la imagen oficial ya no es accesible.
  # bitnamilegacy/ es donde Bitnami dejó sus imágenes de libre acceso: es MinIO
  # real (2025.5.24), no un mock. El namespace está congelado y no recibe
  # parches, lo cual se acepta porque solo se usa en local y staging —
  # producción usa AWS S3.
  #
  # Esta imagen crea los buckets de MINIO_DEFAULT_BUCKETS al arrancar, así que
  # ya no hace falta el servicio minio-init con el cliente mc.
  minio:
    image: bitnamilegacy/minio:2025.5.24
    container_name: sadday-minio
    # Sin "command": el entrypoint de Bitnami arranca el servidor y la consola.
    # Credenciales y buckets: override.yml en local, Infisical en staging.
    ports:
      - "9000:9000"   # API S3-compatible
      - "9001:9001"   # Consola web
    volumes:
      - sadday-minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sadday-network

  mailpit:
    image: axllent/mailpit:v1.29.7
    container_name: sadday-mailpit
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "8025:8025"   # Interfaz web
      - "1025:1025"   # Servidor SMTP
    networks:
      - sadday-network

  api:
    build: ./backend
    container_name: sadday-api
    # Solo postgres: la dependencia de MinIO la añaden los entornos que lo usan
    # (local y staging). Producción usa AWS S3 y no arranca MinIO.
    depends_on:
      postgres:
        condition: service_healthy
    # Solo variables idénticas en los tres entornos. El resto —perfil, secretos,
    # endpoints— lo aporta override.yml (local) o el fichero del entorno.
    # La api no lee MAXMIND_*; esas credenciales son del servicio geoip-updater.
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      GEOIP_DB_PATH: /geoip/GeoLite2-City.mmdb
    ports:
      - "8080:8080"
    volumes:
      - ./backend/logs:/app/logs
      - geoip-data:/geoip:ro
    networks:
      - sadday-network

  # Actualiza GeoLite2-City.mmdb semanalmente.
  # Solo corre si usas el perfil "geoip": docker-compose --profile geoip up
  # Requiere cuenta gratuita en maxmind.com y configurar MAXMIND_ACCOUNT_ID + MAXMIND_LICENSE_KEY.
  geoip-updater:
    image: ghcr.io/maxmind/geoipupdate
    container_name: sadday-geoip-updater
    profiles: [geoip]
    environment:
      GEOIPUPDATE_ACCOUNT_ID:  ${MAXMIND_ACCOUNT_ID}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      GEOIPUPDATE_FREQUENCY:   168   # cada 7 días
      GEOIPUPDATE_DB_DIR:      /geoip
    volumes:
      - geoip-data:/geoip
    networks:
      - sadday-network

  frontend:
    build: ./frontend
    container_name: sadday-frontend
    depends_on:
      - api
    ports:
      - "3000:80"
    networks:
      - sadday-network

volumes:
  sadday-pgdata:
  sadday-minio-data:
  geoip-data:

networks:
  sadday-network:
    driver: bridge

name: sadday_app
description: Sadday Club Andino — app mobile oficial
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.9.2
  dio_cookie_manager: ^3.4.0
  cookie_jar: ^4.0.9

  # Storage
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5

  # Auth & Biometrics
  local_auth: ^3.0.1

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Navigation
  go_router: ^17.2.3

  # Forms
  reactive_forms: ^18.2.2

  # Charts
  fl_chart: ^1.2.0

  # QR & PIN
  qr_flutter: ^4.1.0
  pinput: ^6.0.2
  url_launcher: ^6.3.1

  # UI
  awesome_snackbar_content: ^0.1.8
  lucide_icons_flutter: ^3.1.14+1
  google_fonts: ^8.1.0

  # PDF & Files
  flutter_pdfview: ^1.4.4
  share_plus: ^12.0.2
  file_picker: ^8.1.7
  flutter_markdown: ^0.7.7

  # Pagination
  infinite_scroll_pagination: ^5.1.1

  # Config & Utils
  flutter_dotenv: ^6.0.1
  intl: ^0.20.2
  connectivity_plus: ^7.1.1
  logger: ^2.7.0
  synchronized: ^3.4.0+1

  # Security
  flutter_jailbreak_detection: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0
  riverpod_generator: ^4.0.3
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env.dev
    - .env.staging
    - .env.prod
    - assets/icons/
    - assets/docs/
